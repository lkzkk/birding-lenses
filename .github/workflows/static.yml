# Validate and deploy the latest complete main commit to GitHub Pages.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Rapid pushes represent one logical update. Superseded runs must never validate
# a half-updated dataset or deploy over the newest commit.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Contents-API tooling can produce several pushes seconds apart. Give the
      # update a short coalescing window, then only validate the newest main SHA.
      - name: Coalesce rapid main updates
        if: github.event_name == 'push'
        run: sleep 15

      - name: Check this is still the latest main commit
        id: latest
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --quiet --no-tags origin main
          latest="$(git rev-parse origin/main)"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Superseded by $latest; validation and deployment are intentionally skipped."
          fi

      - name: Validate complete data and UI invariants
        if: steps.latest.outputs.deploy == 'true'
        run: python tests/smoke.py

      - name: Setup Pages
        if: steps.latest.outputs.deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.latest.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        if: steps.latest.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
